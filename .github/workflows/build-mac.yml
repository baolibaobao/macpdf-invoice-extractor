name: Build macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos:
    name: Build DZPDFExtractor.app Big Sur Intel
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      ARCHFLAGS: "-arch x86_64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          uname -m
          sw_vers
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip show setuptools

      - name: Run tests
        run: |
          python -m pytest tests -q

      - name: Build macOS .app
        run: |
          pyinstaller \
            --name DZPDFExtractor \
            --noconsole \
            --windowed \
            --target-architecture x86_64 \
            --collect-all customtkinter \
            --collect-all backports \
            --hidden-import backports.tarfile \
            app.py

      - name: Build debug console executable
        run: |
          pyinstaller \
            --name DZPDFExtractorDebug \
            --console \
            --onefile \
            --target-architecture x86_64 \
            --collect-all customtkinter \
            --collect-all backports \
            --hidden-import backports.tarfile \
            app.py

      - name: Package app
        run: |
          test -d "dist/DZPDFExtractor.app"
          file "dist/DZPDFExtractor.app/Contents/MacOS/DZPDFExtractor"
          tar -czf "DZPDFExtractor-macOS-BigSur-Intel.tar.gz" -C dist "DZPDFExtractor.app"

      - name: Package debug executable
        run: |
          test -f "dist/DZPDFExtractorDebug"
          file "dist/DZPDFExtractorDebug"
          tar -czf "DZPDFExtractor-macOS-BigSur-Intel-Debug.tar.gz" -C dist "DZPDFExtractorDebug"

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: DZPDFExtractor-macOS-BigSur-Intel
          path: DZPDFExtractor-macOS-BigSur-Intel.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: DZPDFExtractor-macOS-BigSur-Intel-Debug
          path: DZPDFExtractor-macOS-BigSur-Intel-Debug.tar.gz
          if-no-files-found: error
          retention-days: 14
