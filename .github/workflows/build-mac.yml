name: Build macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos:
    name: Build DZPDFExtractor.app Big Sur Intel
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      ARCHFLAGS: "-arch x86_64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          uname -m
          sw_vers
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip show setuptools

      - name: Run tests
        run: |
          python -m pytest tests -q

      - name: Locate Tcl/Tk runtime
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import sys
          import tkinter

          interp = tkinter.Tcl()
          tcl_version = str(tkinter.TclVersion)
          tk_version = str(tkinter.TkVersion)
          tcl_dir = Path(interp.eval("info library")).resolve()
          search_roots = [
              tcl_dir.parent,
              Path(sys.base_prefix) / "lib",
              Path("/usr/local/lib"),
              Path("/opt/homebrew/lib"),
          ]

          tk_dir = None
          for root in search_roots:
              for name in (f"tk{tk_version}", "tk8.6", "tk8.5", "tk8.7"):
                  candidate = root / name
                  if (candidate / "tk.tcl").exists():
                      tk_dir = candidate.resolve()
                      break
              if tk_dir:
                  break

          if not (tcl_dir / "init.tcl").exists():
              raise SystemExit(f"Cannot find init.tcl under {tcl_dir}")
          if tk_dir is None:
              raise SystemExit("Cannot find tk.tcl")

          print(f"TCL_VERSION={tcl_version}")
          print(f"TK_VERSION={tk_version}")
          print(f"TCL_LIBRARY={tcl_dir}")
          print(f"TK_LIBRARY={tk_dir}")
          print(f"TCL_DATA_NAME=tcl{tcl_version}")
          print(f"TK_DATA_NAME=tk{tk_version}")
          PY
          echo "TCL_VERSION=$TCL_VERSION"
          echo "TK_VERSION=$TK_VERSION"
          echo "TCL_LIBRARY=$TCL_LIBRARY"
          echo "TK_LIBRARY=$TK_LIBRARY"
          echo "TCL_DATA_NAME=$TCL_DATA_NAME"
          echo "TK_DATA_NAME=$TK_DATA_NAME"

      - name: Build macOS .app
        run: |
          pyinstaller \
            --name DZPDFExtractor \
            --noconsole \
            --windowed \
            --target-architecture x86_64 \
            --collect-all customtkinter \
            --collect-all backports \
            --hidden-import backports.tarfile \
            --add-data "$TCL_LIBRARY:_tcl_data/$TCL_DATA_NAME" \
            --add-data "$TK_LIBRARY:_tcl_data/$TK_DATA_NAME" \
            app.py

      - name: Build debug console executable
        run: |
          pyinstaller \
            --name DZPDFExtractorDebug \
            --console \
            --onefile \
            --target-architecture x86_64 \
            --collect-all customtkinter \
            --collect-all backports \
            --hidden-import backports.tarfile \
            --add-data "$TCL_LIBRARY:_tcl_data/$TCL_DATA_NAME" \
            --add-data "$TK_LIBRARY:_tcl_data/$TK_DATA_NAME" \
            app.py

      - name: Package app
        run: |
          test -d "dist/DZPDFExtractor.app"
          file "dist/DZPDFExtractor.app/Contents/MacOS/DZPDFExtractor"
          tar -czf "DZPDFExtractor-macOS-BigSur-Intel.tar.gz" -C dist "DZPDFExtractor.app"

      - name: Package debug executable
        run: |
          test -f "dist/DZPDFExtractorDebug"
          file "dist/DZPDFExtractorDebug"
          tar -czf "DZPDFExtractor-macOS-BigSur-Intel-Debug.tar.gz" -C dist "DZPDFExtractorDebug"

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: DZPDFExtractor-macOS-BigSur-Intel
          path: DZPDFExtractor-macOS-BigSur-Intel.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: DZPDFExtractor-macOS-BigSur-Intel-Debug
          path: DZPDFExtractor-macOS-BigSur-Intel-Debug.tar.gz
          if-no-files-found: error
          retention-days: 14
