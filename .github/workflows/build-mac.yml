name: Build macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos:
    name: Build DZPDFExtractor.app Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          uname -m
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests -q

      - name: Build macOS .app
        run: |
          pyinstaller \
            --name DZPDFExtractor \
            --noconsole \
            --windowed \
            --collect-all customtkinter \
            app.py

      - name: Package app
        run: |
          test -d "dist/DZPDFExtractor.app"
          tar -czf "DZPDFExtractor-macOS-Intel.tar.gz" -C dist "DZPDFExtractor.app"

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: DZPDFExtractor-macOS-Intel
          path: DZPDFExtractor-macOS-Intel.tar.gz
          if-no-files-found: error
          retention-days: 14
